<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brick Burst</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- AUTH MODAL -->
  <div id="authModal" class="authModal">
    <div class="auth-box">
      <h1>BRICK BURST</h1>
      <p>Match blocks & earn rewards!</p>

      <div id="loginForm">
        <input type="text" id="loginUser" placeholder="Username">
        <input type="password" id="loginPass" placeholder="Password">
        <button onclick="doLogin()">Login</button>
        <p>Don't have an account? <a href="#" onclick="show('registerForm');hide('loginForm');return false;">Register</a></p>
      </div>

      <div id="registerForm" class="hidden">
        <input type="text" id="regUser" placeholder="Username">
        <input type="password" id="regPass" placeholder="Password (min 6)">
        <input type="password" id="regConfirm" placeholder="Confirm Password">
        <button onclick="doRegister()">Create Account</button>
        <p>Already have an account? <a href="#" onclick="show('loginForm');hide('registerForm');return false;">Login</a></p>
      </div>

      <div id="authStatus" class="status"></div>
    </div>
  </div>

  <!-- MENU SCREEN -->
  <div id="menuScreen" class="hidden">
    <h1>MAIN MENU</h1>
    <button onclick="show('gameScreen')">Start Game</button>
    <button onclick="show('settingsScreen')">Settings</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="hidden">
    <h2>Game Area</h2>
    <div id="gameGrid"></div>
    <button onclick="show('menuScreen')">Back</button>
  </div>

  <!-- SETTINGS SCREEN -->
  <div id="settingsScreen" class="hidden">
    <h2>Settings</h2>
    <button onclick="show('menuScreen')">Back</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
